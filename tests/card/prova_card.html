<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prova Nexus Pompa di Calore</title>
<style>
  body { margin: 0; padding: 18px; background: #F2F4F7; font-family: system-ui, "Segoe UI", sans-serif; }
  body.scuro { background: #0F151B; color: #E8ECF1; }
  figure { margin: 0 0 26px; max-width: 820px; }
  figcaption { font-size: 14px; font-weight: 600; color: #46525F; padding: 0 2px 8px; }
  ha-card { display: block; background: var(--card-background-color, #FFFFFF); border-radius: 14px; box-shadow: 0 2px 8px rgba(31,41,51,.14); --primary-text-color: #1F2933; }
  body.scuro ha-card { --card-background-color: #1C242D; --primary-text-color: #E8ECF1; }
  pre#esito { white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; background: #fff; padding: 14px 18px; border-radius: 10px; }
</style>
</head>
<body>
<div id="plancia"></div>
<pre id="esito">in corso...</pre>

<script type="module">
import { CASI, MAPPA, ENTITA, fintoHass } from "./casi.js";
import "../../custom_components/nexus_pompa_calore/www/nexus-pompa-calore-card.js";

const parametri = new URLSearchParams(location.search);
const scuro = parametri.get("tema") === "scuro";
const soloCaso = parametri.get("caso");
if (scuro) document.body.classList.add("scuro");
if (parametri.get("solo") === "1") document.getElementById("esito").style.display = "none";

const attendi = (ms) => new Promise((r) => setTimeout(r, ms));
const carte = {};
const plancia = document.getElementById("plancia");

function nuovaCarta(config, stati, dove = plancia, didascalia = "") {
  const figura = document.createElement("figure");
  if (didascalia && parametri.get("solo") !== "1") {
    const f = document.createElement("figcaption");
    f.textContent = didascalia;
    figura.appendChild(f);
  }
  const carta = document.createElement("nexus-pompa-calore-card");
  carta.setConfig(config);
  carta.hass = fintoHass(stati, scuro);
  figura.appendChild(carta);
  dove.appendChild(figura);
  return carta;
}

for (const [nome, caso] of Object.entries(CASI)) {
  if (soloCaso && nome !== soloCaso) continue;
  carte[nome] = nuovaCarta({ type: "custom:nexus-pompa-calore-card", entity: MAPPA }, caso.stati, plancia, `${nome} — ${caso.titolo}`);
}
await attendi(400);

const righe = [];
let passate = 0;
const fallite = [];
function v(descrizione, condizione) {
  if (condizione) { passate += 1; righe.push(`ok   ${descrizione}`); }
  else { fallite.push(descrizione); righe.push(`NO   ${descrizione}`); }
}
const q = (nome, sel) => carte[nome].shadowRoot.querySelector(sel);
const testoDi = (nome, slot) => { const n = q(nome, `[data-valore="${slot}"]`); return n ? n.textContent : null; };
const tessere = (nome) => Array.from(carte[nome].shadowRoot.querySelectorAll(".tessera")).map((t) => t.textContent);
const inMoto = (nome, sel) => { const n = q(nome, sel); return n ? n.classList.contains("in-moto") : false; };
const durata = (nome, sel) => { const n = q(nome, sel); return n ? parseFloat(n.style.animationDuration) : null; };

if (!soloCaso) {
  righe.push("1. Ferma, di notte");
  v("il valore di mandata arriva dall'entita' collegata nella mappa", testoDi("fermo", "mandata") === "29,5 °C");
  v("il compressore mostra lo stato tradotto", testoDi("fermo", "compressore") === "Inattivo");
  v("niente flusso", !inMoto("fermo", '[data-flusso="mandata"]') && !inMoto("fermo", '[data-flusso="ritorno"]'));
  v("ventola ferma", !inMoto("fermo", '[data-ventola="pdc"]'));
  v("bollitore caldo a 48,5 °C", q("fermo", '[data-acqua="acs"]').getAttribute("fill") === "#DE4A51");
  v("salto termico preso dall'integrazione", tessere("fermo").some((t) => t.startsWith("Salto termico 1,0")));
  v("titolo: il nome dato all'integrazione", q("fermo", ".testata").textContent === "Centrale Termica");

  // Controllo che discrimina: un salto termico diverso dal conto sui grezzi.
  // Se la card rifacesse il conto da se' mostrerebbe 1,0 e non 9,9.
  const statiFalsati = JSON.parse(JSON.stringify(CASI.fermo.stati));
  statiFalsati[MAPPA].attributes.derivate.salto_termico = 9.9;
  const falsata = nuovaCarta({ entity: MAPPA }, statiFalsati);
  v("la card mostra il salto termico dell'integrazione, non lo ricalcola",
    Array.from(falsata.shadowRoot.querySelectorAll(".tessera")).some((t) => t.textContent.startsWith("Salto termico 9,9")));
  falsata.closest("figure").remove();

  righe.push("", "2. In marcia");
  v("il flusso si muove", inMoto("marcia", '[data-flusso="mandata"]'));
  v("ritorno contro corrente e alla stessa velocita'",
    q("marcia", '[data-flusso="ritorno"]').classList.contains("contro") && durata("marcia", '[data-flusso="mandata"]') === durata("marcia", '[data-flusso="ritorno"]'));
  v("la ventola gira a 46 Hz", Math.abs(durata("marcia", '[data-ventola="pdc"]') - 0.61) < 0.02);
  v("piu' portata, ciclo piu' breve", durata("marcia", '[data-flusso="mandata"]') < durata("sbrinamento", '[data-flusso="mandata"]'));
  v("il pavimento respira col salto termico positivo", inMoto("marcia", '[data-respira="pavimento"]'));
  v("tessera del boost", tessere("marcia").includes("Boost ACS"));
  v("spia verde", q("marcia", '[data-spia="compressore"]').getAttribute("fill") === "#2E9E6B");

  righe.push("", "3. Sbrinamento e guasto");
  v("tessere di sbrinamento, guasto e vacanza",
    tessere("sbrinamento").includes("Sbrinamento in corso") && tessere("sbrinamento").some((t) => t.startsWith("Guasto")) && tessere("sbrinamento").some((t) => t.includes("vacanza")));
  v("accumulo non disponibile dichiarato", testoDi("sbrinamento", "accumulo") === "Non disponibile");
  v("salto negativo: il pavimento non respira", !inMoto("sbrinamento", '[data-respira="pavimento"]'));

  righe.push("", "4. Configurazione minima");
  v("i riquadri non collegati spariscono", q("senza_portata", '[data-slot="portata"]').hidden && q("senza_portata", '[data-slot="esterna"]').hidden);
  v("quelli collegati restano", !q("senza_portata", '[data-slot="mandata"]').hidden);
  v("senza portata il flusso si muove col compressore", inMoto("senza_portata", '[data-flusso="mandata"]'));
  v("e una tessera lo dichiara", tessere("senza_portata").includes("Flusso stimato dal compressore"));
  v("titolo dal nome della voce", q("senza_portata", ".testata").textContent === "PdC piccola");

  righe.push("", "5. Titolo, tema, animazioni");
  const conTitolo = nuovaCarta({ entity: MAPPA, title: "Caldaia" }, CASI.fermo.stati);
  const senzaTitolo = nuovaCarta({ entity: MAPPA, title: "" }, CASI.fermo.stati);
  const ferma = nuovaCarta({ entity: MAPPA, animazioni: false }, CASI.marcia.stati);
  await attendi(300);
  v("il titolo della card vince sul nome", conTitolo.shadowRoot.querySelector(".testata").textContent === "Caldaia");
  v("titolo vuoto: nessuna testata", senzaTitolo.shadowRoot.querySelector(".testata") === null);
  v("animazioni: false ferma davvero", getComputedStyle(ferma.shadowRoot.querySelector('[data-flusso="mandata"]')).animationName === "none");
  const scura = document.createElement("nexus-pompa-calore-card");
  scura.setConfig({ entity: MAPPA });
  scura.hass = fintoHass(CASI.fermo.stati, true);
  document.body.appendChild(scura);
  v("tema scuro", scura.shadowRoot.querySelector(".scena").classList.contains("scuro"));
  [conTitolo, senzaTitolo, ferma, scura].forEach((c) => c.remove());

  righe.push("", "6. Mappa che manca o non e' quella giusta");
  const assente = nuovaCarta({ entity: "sensor.non_esiste" }, CASI.fermo.stati);
  const spenta = nuovaCarta({ entity: "sensor.spenta" }, { ...CASI.fermo.stati, "sensor.spenta": { entity_id: "sensor.spenta", state: "unavailable", attributes: { friendly_name: "Mappa" } } });
  const sbagliata = nuovaCarta({ entity: "sensor.altra" }, { ...CASI.fermo.stati, "sensor.altra": { entity_id: "sensor.altra", state: "3", attributes: { ruolo: "mappa_fotovoltaico" } } });
  v("sensore inesistente: avviso che spiega", /non esiste/.test(assente.shadowRoot.textContent) && !assente.shadowRoot.querySelector("svg"));
  v("integrazione non caricata: avviso", /non e' caricata/.test(spenta.shadowRoot.textContent));
  v("mappa di un'altra integrazione: avviso", /non e' una mappa/.test(sbagliata.shadowRoot.textContent));
  spenta.hass = fintoHass(CASI.fermo.stati);
  spenta.setConfig({ entity: MAPPA });
  v("quando la mappa torna, torna il disegno", spenta.shadowRoot.querySelector("svg") !== null);
  let rifiutata = false;
  try { document.createElement("nexus-pompa-calore-card").setConfig({}); } catch (e) { rifiutata = true; }
  v("senza entity la configurazione viene rifiutata", rifiutata);
  const Classe = customElements.get("nexus-pompa-calore-card");
  v("nel selettore delle card si propone la mappa trovata", Classe.getStubConfig(fintoHass(CASI.fermo.stati)).entity === MAPPA);
  [assente, spenta, sbagliata].forEach((c) => c.remove());

  righe.push("", "7. Clic, testi e schermi stretti");
  let aperta = null;
  carte.fermo.addEventListener("hass-more-info", (e) => { aperta = e.detail.entityId; });
  q("fermo", '[data-slot="portata"]').dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
  v("un clic sul riquadro apre l'entita' collegata", aperta === ENTITA.portata);
  const sbordati = [];
  Object.entries(carte).forEach(([nome, carta]) => {
    carta.shadowRoot.querySelectorAll("[data-valore]").forEach((n) => {
      const r = n.closest("[data-slot]");
      if (r && r.hidden) return;
      if (n.getComputedTextLength() > Number(n.dataset.spazio) + 0.5) sbordati.push(`${nome}/${n.dataset.valore}`);
    });
  });
  v(`ogni valore sta nel suo riquadro${sbordati.length ? " (" + sbordati.join(", ") + ")" : ""}`, sbordati.length === 0);
  const stretta = document.createElement("div");
  stretta.style.width = "360px";
  document.body.appendChild(stretta);
  const piccola = nuovaCarta({ entity: MAPPA }, CASI.marcia.stati, stretta);
  await attendi(300);
  const portata = piccola.shadowRoot.querySelector('[data-valore="portata"]');
  v("in una card da 360px il numero cresce", Number(portata.getAttribute("font-size")) > 34);
  v("e resta nel riquadro", portata.getComputedTextLength() <= Number(portata.dataset.spazio));
  stretta.remove();

  righe.push("", fallite.length ? `PROVE: ${passate} superate, ${fallite.length} FALLITE` : `PROVE: TUTTE SUPERATE (${passate})`);
}
document.getElementById("esito").textContent = righe.join("\n");
</script>
</body>
</html>
